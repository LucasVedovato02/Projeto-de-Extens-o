<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TRAMA - Login</title>

    <link rel="stylesheet" href="projeto.css">
</head>

<body>

    <!-- CABEÇALHO -->
    <header class="header">

        <div class="logo">
            TRAMA
        </div>

        <div class="menu">

            <div class="user-icon">
                ◉
            </div>

            <div class="hamburguer">
                ☰
            </div>

        </div>

    </header>


    <!-- FUNDO -->
    <main class="background">

        <div class="imagem esquerda"></div>

        <div class="imagem centro"></div>

        <div class="imagem direita"></div>

    </main>


    <!-- LOGIN -->
    <section class="login-container">

        <div class="login-box">

            <h1>Login</h1>

            <form>

                <div class="input-box">

                    <input
                        type="email"
                        placeholder="E-mail"
                        required
                    >

                </div>


                <div class="input-box">

                    <input
                        type="password"
                        placeholder="Senha"
                        required
                    >

                </div>


                <button type="submit">
                    Entrar
                </button>

            </form>


            <div class="links">

                <p>
                    Não tem uma conta?
                    <a href="#">Cadastre-se</a>
                </p>

                <a href="#">
                    Esqueci minha senha
                </a>

            </div>

        </div>

    </section>

</body>

</html>
